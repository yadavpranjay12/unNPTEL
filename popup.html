<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 240px;
      padding: 14px;
      margin: 0;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    p {
      font-size: 12px;
      line-height: 1.6;
      color: #555;
      margin: 10px 0 0;
    }
    code {
      background: #f2f2f2;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 11px;
    }
    img.logo {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 0 10px;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="logo" />
  <h1>UnNPTEL</h1>
  <p>Go to <code>nptel.ac.in</code> course page.<br>Extension works on all pages and subdomains.</p>
</body>
</html>
